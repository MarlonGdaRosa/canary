; Apply to the dedicated pool / FastCGI instance, never the local development PHP.
; Replace private filesystem paths for Windows. Enable installed PDO MySQL,
; mbstring, curl, gd, openssl, sodium, XML, fileinfo and OPcache extensions.
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL
error_log=/var/log/canaryaac/php-error.log
date.timezone=UTC
cgi.fix_pathinfo=0
file_uploads=Off
allow_url_include=Off
post_max_size=64K
max_execution_time=30
max_input_time=15
memory_limit=256M
session.use_strict_mode=1
session.use_only_cookies=1
session.use_trans_sid=0
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
session.save_path=/var/lib/canaryaac/security/sessions
sys_temp_dir=/var/lib/canaryaac/tmp
upload_tmp_dir=/var/lib/canaryaac/tmp
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
