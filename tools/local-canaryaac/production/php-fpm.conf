[canaryaac]
user = canaryaac
group = canaryaac
listen = /run/php/canaryaac.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 30s
security.limit_extensions = .php
clear_env = yes
catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/canaryaac/php-error.log
php_admin_value[session.save_path] = /var/lib/canaryaac/security/sessions
php_admin_value[upload_tmp_dir] = /var/lib/canaryaac/tmp
php_admin_value[sys_temp_dir] = /var/lib/canaryaac/tmp
php_admin_value[open_basedir] = /srv/canaryaac:/var/lib/canaryaac:/var/log/canaryaac
