# Template: load inside http {}. Replace example.invalid, release and certificate
# paths only after the operator gates in docs/operations/canaryaac-production.md.
limit_req_zone $binary_remote_addr zone=aac_pages:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aac_login:10m rate=5r/m;
log_format aac_redacted '$remote_addr $request_method $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name example.invalid;
    return 308 https://example.invalid$request_uri;
}
server {
    listen 443 ssl;
    server_name example.invalid;
    root /srv/canaryaac/releases/REPLACE_RELEASE/public;
    ssl_certificate /etc/ssl/REPLACE_CERTIFICATE/fullchain.pem;
    ssl_certificate_key /etc/ssl/REPLACE_CERTIFICATE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req zone=aac_pages burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/canaryaac/access.log aac_redacted;
    error_log /var/log/canaryaac/nginx-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Reject encoded separators, double encodings and control bytes in the path.
    # Only %20 in character names is accepted by the PHP route policy.
    if ($request_uri ~* "^/[^?]*%(?!20)") { return 404; }
    if ($uri ~ "(^|/)\.|\\|//") { return 404; }
    if ($uri ~* "\.(php[0-9]*|phtml|phar|env|sql|ini|lock|twig|bak|old|log)(\.|/)") { return 404; }

    location = /login {
        limit_except POST { deny all; }
        limit_req zone=aac_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host example.invalid;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto "";
    }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_REAL_IP "";
        fastcgi_pass unix:/run/php/canaryaac.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
        # The edge owns these headers, including static/error responses. Suppress
        # WebSecurity's copies before applying the server-level add_header values.
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Content-Security-Policy;
    }
    location ~* ^/resources/(base|bootstrap|canary|icons|images|javascripts|styles)/[a-z0-9_/-][a-z0-9_./-]*\.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location /resources/ { return 404; }
    location ~* \.[a-z0-9]+(/|$) { return 404; }
    location ~* ^/(app|includes|routes|vendor|admin|upload)(/|$) { return 404; }
    location / {
        limit_except GET HEAD POST { deny all; }
        rewrite ^ /index.php last;
    }
}
